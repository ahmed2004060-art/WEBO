plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}
android {
    namespace "com.webo.lab"
    compileSdk 34
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    defaultConfig {
        applicationId "com.webo.lab"
        minSdk 24
        targetSdk 34
        // versionCode يزيد تلقائياً مع كل بناء في GitHub Actions حتى يُقبل التحديث فوق النسخة المثبتة
        def runNo = (System.getenv("GITHUB_RUN_NUMBER") ?: System.getenv("WEBO_LAB_BUILD_NUMBER") ?: "0").toInteger()
        versionCode 200 + runNo
        versionName "2.0." + runNo
    }
    // مفتاح توقيع مستقل لهذا التطبيق الجديد فقط؛ يُستخدم المفتاح نفسه لكل تحديث لاحق.
    def labSigning = new Properties()
    def labSigningFile = rootProject.file("webo-lab-signing.properties")
    if (labSigningFile.exists()) labSigningFile.withInputStream { labSigning.load(it) }
    def ksPath = System.getenv("WEBO_LAB_KEYSTORE") ?: labSigning.getProperty("storeFile", "app/webo_lab.keystore")
    def ksPass = System.getenv("WEBO_LAB_STORE_PASSWORD") ?: labSigning.getProperty("storePassword", "")
    def ksAlias = System.getenv("WEBO_LAB_KEY_ALIAS") ?: labSigning.getProperty("keyAlias", "webo_lab")
    def keyPass = System.getenv("WEBO_LAB_KEY_PASSWORD") ?: labSigning.getProperty("keyPassword", ksPass)
    signingConfigs {
        lab {
            storeFile rootProject.file(ksPath)
            storePassword ksPass
            keyAlias ksAlias
            keyPassword keyPass
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.lab }
        release { signingConfig signingConfigs.lab; minifyEnabled false }
    }
}
dependencies {
    implementation 'com.googlecode.mp4parser:isoparser:1.1.22'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'androidx.media3:media3-database:1.4.1'
    implementation 'androidx.media3:media3-datasource:1.4.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
}
