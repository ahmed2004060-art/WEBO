name: Build APK and Run Explorer Test
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -v '^$' build.log | tail -n 35 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=GradleLog::$msg"
          fi
          exit $code
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Webo explorer test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: |
            gradle installDebug --no-daemon --console=plain
            adb shell pm grant com.webo android.permission.CAMERA || true
            adb shell pm grant com.webo android.permission.RECORD_AUDIO || true
            adb shell pm grant com.webo android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant com.webo android.permission.ACCESS_COARSE_LOCATION || true
            gradle connectedDebugAndroidTest --no-daemon --console=plain || true
            mkdir -p webo-test-report
            adb pull /sdcard/Download/webo-test-report webo-test-report || true
      - name: Zip test report
        if: always()
        run: |
          if [ -d webo-test-report ]; then zip -r webo-test-report.zip webo-test-report; fi
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f webo-test-report.zip ]; then assets="$assets webo-test-report.zip"; fi
          gh release create "v${{ github.run_number }}" $assets --title "WEBO" --notes "apk + تقرير اختبار Webo"
